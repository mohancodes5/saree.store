{% extends "base.html" %}
{% block content %}
<h1 class="mb-6 text-2xl font-semibold">Wishlist</h1>
<div class="grid gap-4 sm:grid-cols-2 md:grid-cols-3">
  {% for w in items %}
    <div class="space-y-2">
      {% include "partials/product_card.html" with p=w.product %}
      <form action="{% url 'wishlist:to_cart' w.product.id %}" method="post">{% csrf_token %}
        <button class="w-full rounded-full border border-stone-200 py-2 text-xs font-semibold hover:bg-stone-50">Move to bag</button>
      </form>
    </div>
  {% empty %}
    <p class="text-stone-600">Wishlist is empty.</p>
  {% endfor %}
</div>
{% endblock %}
