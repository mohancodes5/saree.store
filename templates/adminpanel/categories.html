{% extends "adminpanel/base_admin.html" %}
{% block content %}
<h1 class="text-2xl font-semibold">Categories</h1>
<form method="post" class="mt-6 max-w-md space-y-2 rounded-2xl border border-slate-800 bg-slate-900/40 p-4 text-sm">
  {% csrf_token %}
  <input name="name" placeholder="Name" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2" required>
  <textarea name="description" rows="2" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2"></textarea>
  <button class="rounded-full bg-pink-500 px-4 py-2 text-xs font-semibold text-white">Add</button>
</form>
<ul class="mt-8 space-y-2 text-sm">
  {% for c in categories %}<li class="rounded-lg border border-slate-800 px-3 py-2"><a href="{{ c.get_absolute_url }}" class="text-pink-400 hover:underline">{{ c.name }}</a></li>{% endfor %}
</ul>
{% endblock %}
