{% extends "adminpanel/base_admin.html" %}
{% block content %}
<div class="flex flex-wrap items-center justify-between gap-3">
  <h1 class="text-2xl font-semibold">Products</h1>
  <a href="{% url 'adminpanel:product_new' %}" class="rounded-full bg-pink-500 px-4 py-2 text-sm font-semibold text-white">Add saree</a>
</div>
<form method="get" class="mt-4"><input name="q" value="{{ request.GET.q }}" placeholder="Search" class="rounded-xl border border-slate-700 bg-slate-900 px-3 py-2 text-sm"></form>
<div class="mt-6 space-y-2">
  {% for p in products %}
    <div class="flex items-center justify-between rounded-xl border border-slate-800 bg-slate-900/50 px-4 py-3 text-sm">
      <div>
        <p class="font-medium">{{ p.name }}</p>
        <p class="text-xs text-slate-500">{{ p.category.name }} · ₹{{ p.effective_price }} · stock {{ p.stock }}</p>
      </div>
      <a href="{% url 'adminpanel:product_edit' p.pk %}" class="text-pink-400 hover:underline">Edit</a>
    </div>
  {% endfor %}
</div>
{% endblock %}
