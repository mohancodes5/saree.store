{% extends "adminpanel/base_admin.html" %}
{% block content %}
<h1 class="text-2xl font-semibold">Orders</h1>
<div class="mt-6 space-y-3 text-sm">
  {% for o in orders %}
    <div class="rounded-xl border border-slate-800 bg-slate-900/50 p-4">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <p class="font-mono font-semibold">{{ o.order_number }}</p>
        <span class="text-xs text-slate-400">{{ o.get_status_display }}</span>
      </div>
      <p class="text-xs text-slate-500">{{ o.user }} · ₹{{ o.total }} · {{ o.payment_method }}</p>
      <form method="post" action="{% url 'adminpanel:order_status' o.pk %}" class="mt-3 flex flex-wrap gap-2">
        {% csrf_token %}
        <select name="status" class="rounded-lg border border-slate-700 bg-slate-950 px-2 py-1 text-xs">
          {% for val,label in status_choices %}<option value="{{ val }}" {% if o.status == val %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
        <button class="rounded-full bg-pink-500 px-3 py-1 text-xs font-semibold">Update</button>
      </form>
      <form method="post" action="{% url 'adminpanel:order_cancel' o.pk %}" class="mt-2" onsubmit="return confirm('Cancel order?');">{% csrf_token %}<button class="text-xs text-red-400">Cancel / refund flag</button></form>
    </div>
  {% endfor %}
</div>
{% endblock %}
