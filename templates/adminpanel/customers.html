{% extends "adminpanel/base_admin.html" %}
{% block content %}
<h1 class="text-2xl font-semibold">Customers</h1>
<div class="mt-6 space-y-2 text-sm">
  {% for u in users %}
    <div class="flex flex-wrap items-center justify-between gap-2 rounded-xl border border-slate-800 bg-slate-900/50 px-3 py-2">
      <div>
        <p class="font-medium">{{ u.username }}</p>
        <p class="text-xs text-slate-500">{{ u.email }} · joined {{ u.date_joined|date:"M Y" }}</p>
      </div>
    </div>
  {% endfor %}
</div>
<div class="mt-10 max-w-lg rounded-2xl border border-slate-800 bg-slate-900/40 p-4">
  <h2 class="font-semibold">Promotional WhatsApp</h2>
  <form method="post" action="{% url 'adminpanel:promo_whatsapp' %}" class="mt-3 space-y-2 text-sm">
    {% csrf_token %}
    <input name="phone" placeholder="+9198..." class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2">
    <textarea name="message" rows="3" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2" placeholder="Message"></textarea>
    <button class="rounded-full bg-pink-500 px-4 py-2 text-xs font-semibold text-white">Send</button>
  </form>
</div>
{% endblock %}
