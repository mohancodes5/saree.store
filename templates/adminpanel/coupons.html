{% extends "adminpanel/base_admin.html" %}
{% block content %}
<h1 class="text-2xl font-semibold">Coupons</h1>
<form method="post" class="mt-6 max-w-md space-y-2 rounded-2xl border border-slate-800 bg-slate-900/40 p-4 text-sm">
  {% csrf_token %}
  <input name="code" placeholder="CODE" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2" required>
  <input name="description" placeholder="Description" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2">
  <select name="discount_type" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2">
    <option value="percent">Percent</option>
    <option value="fixed">Fixed ₹</option>
  </select>
  <input name="discount_value" type="number" step="0.01" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2" placeholder="Value">
  <input name="min_order_amount" type="number" step="0.01" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2" placeholder="Min order">
  <button class="rounded-full bg-pink-500 px-4 py-2 text-xs font-semibold text-white">Create</button>
</form>
<ul class="mt-8 space-y-2 text-sm">
  {% for c in coupons %}<li class="rounded-lg border border-slate-800 px-3 py-2">{{ c.code }} — {{ c.discount_type }} {{ c.discount_value }} (valid until {{ c.valid_until|date:"M d, Y" }})</li>{% endfor %}
</ul>
{% endblock %}
