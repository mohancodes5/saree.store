{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="mx-auto max-w-md rounded-3xl bg-white p-8 shadow-soft ring-1 ring-stone-100">
  <h1 class="text-xl font-semibold">Create account</h1>
  <form method="post" class="mt-6 space-y-3 text-sm">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="w-full rounded-full bg-brand-600 py-2.5 font-semibold text-white">Sign up</button>
  </form>
  <p class="mt-4 text-center text-xs">Already have an account? <a href="{% url 'accounts:login' %}" class="font-semibold text-brand-600">Login</a></p>
</div>
{% endblock %}
