{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-md rounded-3xl bg-white p-8 text-sm shadow-soft ring-1 ring-stone-100">
  <h1 class="text-lg font-semibold">Verify phone (optional demo)</h1>
  <form method="post" class="mt-4 space-y-3">
    {% csrf_token %}
    <input name="code" placeholder="6-digit OTP" class="w-full rounded-xl border px-3 py-2">
    <button class="w-full rounded-full bg-brand-600 py-2 font-semibold text-white">Verify</button>
  </form>
</div>
{% endblock %}
